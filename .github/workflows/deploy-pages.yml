# Publishes the app to GitHub Pages at https://app.tehqeqatehadees.com.
# Free when this repository is public (or the organisation plan includes
# Pages for private repositories). Alternative with a private repository:
# Cloudflare Pages, see README "Hosting".
name: Deploy app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install -g pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # GitHub Pages has no SPA fallback: unknown paths get 404.html, so the
      # app shell is served there too (the service worker takes over after).
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
