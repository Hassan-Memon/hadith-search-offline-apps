# Builds the app and its data, and publishes both to GitHub Pages
# (free for public repositories).
#
# Data: packages/core/src/build/data.ts reads the website's public API
# (the same requests a visitor's browser makes), compares with the build that
# is currently published, fetches only new or edited hadith and writes
# data/manifest.json, the snapshot and a small change file. A normal run makes
# about 91 small requests to the website.
#
# Runs on every push to main and every 6 hours.
name: Deploy app and data

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install -g pnpm@12.16.1
      - run: pnpm install --frozen-lockfile

      # base_path is "" with a custom domain and "/<repo>" on <user>.github.io.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build the app
        run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Build the data from tehqeqatehadees.com
        run: >
          node packages/core/dist/scripts/build-data.js
          --site https://tehqeqatehadees.com
          --prev "${{ steps.pages.outputs.base_url }}/data/"
          --out apps/web/dist/data

      # GitHub Pages has no SPA fallback: unknown paths get 404.html, so the
      # app shell is served there too (the service worker takes over after).
      - run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
