name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install -g pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - name: Core tests (normaliser, search, sync engine, data builder)
        run: pnpm --filter @tehqeqat/core test
      - name: Type-check and build the app
        run: pnpm --filter @tehqeqat/web build
